env: prod

server:
  port: "8080"

log:
  level: warn
  format: json

# Inbound rate limit, per client IP.
rate_limit:
  disabled: false
  max: 120
  window_seconds: 60

# Default circuit breaker for outbound dependencies (pkg/resilience).
breaker:
  failure_threshold: 5
  open_seconds: 30
  half_open_max_calls: 1
