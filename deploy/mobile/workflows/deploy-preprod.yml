# Copy to <your-repo>/.github/workflows/<id>-deploy-preprod.yml
# "preprod" in the name maps this workflow to TaskTrooper's preprod_deploy slot.
name: deploy-preprod

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-preprod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: ios
    runs-on: macos-14 # iOS builds require macOS
    environment: preprod
    env:
      DEPLOY_ENV: preprod
      APP_DIR: ${{ vars.APP_DIR || '.' }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }} # base64 of the .p8
      IOS_SCHEME: ${{ vars.IOS_SCHEME }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      TF_EXTERNAL_GROUP: ${{ vars.TF_EXTERNAL_GROUP }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ${{ env.APP_DIR }}
      - name: Fastlane iOS deploy
        working-directory: ${{ env.APP_DIR }}
        run: bundle exec fastlane ios deploy

  android:
    name: android
    runs-on: ubuntu-latest
    environment: preprod
    env:
      DEPLOY_ENV: preprod
      APP_DIR: ${{ vars.APP_DIR || '.' }}
      ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
      PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ${{ env.APP_DIR }}
      - name: Decode upload keystore
        working-directory: ${{ env.APP_DIR }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 --decode > app/upload.keystore
      - name: Fastlane Android deploy
        working-directory: ${{ env.APP_DIR }}
        run: bundle exec fastlane android deploy
