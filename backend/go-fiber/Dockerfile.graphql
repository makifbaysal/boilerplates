FROM golang:1.26.3-alpine3.22 AS build
WORKDIR /src
COPY go.mod go.sum ./
RUN go mod download
COPY . .
RUN CGO_ENABLED=0 go build -o /out/graphql ./cmd/graphql

FROM alpine:3.22
RUN apk add --no-cache ca-certificates && \
    addgroup -S app && adduser -S -G app app
COPY --from=build /out/graphql /graphql
COPY --from=build /src/configs /configs
ENV CONFIG_DIR=/configs
USER app:app
EXPOSE 8081
ENTRYPOINT ["/graphql"]
