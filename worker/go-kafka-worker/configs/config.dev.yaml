env: dev

kafka:
  brokers: ["localhost:9092"]
  topic: task-events
  group_id: go-kafka-worker

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  queue: task-events

log:
  level: debug
  format: text

# Processing rate ceiling. The queue absorbs the burst; the database does not.
rate_limit:
  per_second: 500
  burst: 500
  wait_seconds: 5

# Default circuit breaker for outbound dependencies (pkg/resilience).
breaker:
  failure_threshold: 5
  open_seconds: 30
  half_open_max_calls: 1
