# Local backing services for the outbound DB adapters and their
# integration tests (internal/adapter/outbound/{postgres,mongo,cassandra}
# *_integration_test.go — each skips unless its env var below is set).
# Not used by CI; CI runs unit tests only. `docker compose -f
# docker-compose.dev.yml up -d`, then:
#   POSTGRES_TEST_DSN="postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
#   MONGO_TEST_URI="mongodb://localhost:27017" \
#   CASSANDRA_TEST_HOSTS="localhost" \
#   go test ./internal/adapter/outbound/... -tags=integration -v
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]

  mongo:
    image: mongo:8
    ports: ["27017:27017"]

  cassandra:
    image: cassandra:5
    ports: ["9042:9042"]

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports: ["9200:9200"]
