sonar.projectKey=ios-native
sonar.projectName=SwiftUI app boilerplate
sonar.sourceEncoding=UTF-8

sonar.sources=Sources
sonar.tests=Tests
sonar.exclusions=**/*.generated.swift,**/DerivedData/**
# Requires the community Swift plugin; generate the report from the xcresult
# bundle produced by the test job (e.g. xccov view --report --json).
sonar.swift.coverage.reportPath=TestResults.xcresult
