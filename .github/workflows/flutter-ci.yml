name: flutter-ci

on:
  push:
    branches: [main]
    paths:
      - "mobile/flutter/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "mobile/flutter/**"
      - ".github/workflows/flutter-ci.yml"

defaults:
  run:
    working-directory: mobile/flutter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
